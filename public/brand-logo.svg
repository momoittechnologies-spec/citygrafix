<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="100%" height="100%" fill="none">
  <!-- Concept 1: Modern Precision Geometric Monogram - Official Vector Brand Lockup -->
  <defs>
    <linearGradient id="c1-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2255D6"/>
    </linearGradient>
    <linearGradient id="c1-grad-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6D"/>
      <stop offset="100%" stop-color="#F04446"/>
    </linearGradient>
    <linearGradient id="c1-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFC83D"/>
    </linearGradient>
    <filter id="c1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2255D6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Monogram Mark (64x64) -->
  <g transform="translate(8, 8)" filter="url(#c1-glow)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#101B38" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <path d="M 44 16 C 38 12 22 12 16 22 C 10 32 10 42 16 50 C 22 58 38 58 44 52" 
          stroke="url(#c1-grad-blue)" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M 38 28 C 30 24 24 28 24 35 C 24 43 31 46 38 43 L 38 35 L 30 35" 
          stroke="url(#c1-grad-coral)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="48" cy="18" r="4.5" fill="url(#c1-grad-gold)"/>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(86, 12)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Manrope', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="0.03em">
      <tspan fill="#FAFAF7">CITY </tspan>
      <tspan fill="#F04446">GRAFIX</tspan>
    </text>
    <text x="1" y="50" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.18em">
      <tspan fill="#CBD5E1">PRINTING</tspan>
      <tspan fill="#53627B"> • </tspan>
      <tspan fill="#94A3B8">SIGNAGE</tspan>
      <tspan fill="#53627B"> • </tspan>
      <tspan fill="#CBD5E1">ADVERTISING</tspan>
      <tspan fill="#53627B"> • </tspan>
      <tspan fill="#FFC83D">KADAPA</tspan>
    </text>
  </g>
</svg>
