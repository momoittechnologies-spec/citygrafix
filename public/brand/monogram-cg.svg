<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- City Grafix Modern Monogram Icon -->
  <defs>
    <linearGradient id="mono-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2255D6"/>
    </linearGradient>
    <linearGradient id="mono-grad-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6D"/>
      <stop offset="100%" stop-color="#F04446"/>
    </linearGradient>
    <linearGradient id="mono-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFC83D"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="15" fill="#101B38" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  
  <!-- Outer 'C' Ribbon -->
  <path d="M 44 16 C 38 12 22 12 16 22 C 10 32 10 42 16 50 C 22 58 38 58 44 52" 
        stroke="url(#mono-grad-blue)" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  
  <!-- Inner 'G' Arrow -->
  <path d="M 38 28 C 30 24 24 28 24 35 C 24 43 31 46 38 43 L 38 35 L 30 35" 
        stroke="url(#mono-grad-coral)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Registration Eye -->
  <circle cx="48" cy="18" r="4.5" fill="url(#mono-grad-gold)"/>
</svg>
