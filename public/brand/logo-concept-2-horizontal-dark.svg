<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="100%" height="100%" fill="none">
  <!-- Concept 2: Heritage Circular Seal Remastered - Dark Surface Variant -->
  <defs>
    <linearGradient id="c2-outer-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2255D6"/>
      <stop offset="50%" stop-color="#101B38"/>
      <stop offset="100%" stop-color="#F04446"/>
    </linearGradient>
    <linearGradient id="c2-inner-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F04446"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="c2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular Badge Mark (64x64) -->
  <g transform="translate(8, 8)" filter="url(#c2-shadow)">
    <!-- Outer Rim -->
    <circle cx="32" cy="32" r="31" fill="#101B38" stroke="url(#c2-outer-ring)" stroke-width="2.5"/>
    
    <!-- Concentric Accent Track -->
    <circle cx="32" cy="32" r="26" stroke="#FFC83D" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.8"/>
    
    <!-- Inner Core Badge -->
    <circle cx="32" cy="32" r="22" fill="url(#c2-inner-glow)"/>
    
    <!-- Dynamic Script Monogram CG -->
    <path d="M 23 25 C 20 28 19 36 24 39 C 29 42 35 39 37 34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 40 24 L 29 39" stroke="#FFC83D" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 33 32 L 43 32 C 45 36 43 40 38 41 C 34 42 29 40 28 37" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Kadapa Established Star -->
    <circle cx="32" cy="14" r="2" fill="#FFC83D"/>
    <circle cx="32" cy="50" r="2" fill="#FFC83D"/>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(86, 12)">
    <text x="0" y="32" font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="0.04em">
      <tspan fill="#FAFAF7">CITY </tspan>
      <tspan fill="#F04446">GRAFIX</tspan>
    </text>

    <text x="1" y="50" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.18em">
      <tspan fill="#CBD5E1">PRINTING</tspan>
      <tspan fill="#53627B"> • </tspan>
      <tspan fill="#94A3B8">SIGNAGE</tspan>
      <tspan fill="#53627B"> • </tspan>
      <tspan fill="#CBD5E1">ADVERTISING</tspan>
      <tspan fill="#53627B"> • </tspan>
      <tspan fill="#FFC83D">KADAPA</tspan>
    </text>
  </g>
</svg>
